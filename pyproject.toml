[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-risk-engine"
version = "0.1.0"
description = "Explainable Fraud Risk Engine portfolio project."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["fraud", "explainability", "machine learning", "finance", "python"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = ["matplotlib>=3.7.0", "numpy>=1.26.0", "pandas>=2.0.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.0.280"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C", "Q"]
